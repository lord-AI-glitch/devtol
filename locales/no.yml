about:
  content: '# Om DevTol

    Denne fantastiske plattformen samler nyttige verktøy for utviklere, designere
    og IT-fagfolk. Hvis du synes den er nyttig, del den gjerne med kolleger og legg
    den til i bokmerkene dine!

    DevTol kjører på klientsiden, prioriterer personvern og er 100% gratis. Hvis du
    ønsker å støtte utviklingen og oppmuntre til nye verktøy, kan du gjerne [støtte
    oss](https://buymeacoffee.com/lordrealstx).

    ## Teknologier

    DevTol er bygget med Vue 3, TypeScript og Naive UI. Alle verktøy kjører 100% lokalt
    i nettleseren din for maksimal sikkerhet og personvern.

    ## Funnet en feil? Et verktøy som mangler?

    Hvis du trenger et verktøy som foreløpig ikke er tilgjengelig, eller vil rapportere
    et problem, ta gjerne kontakt med teamet vårt.

    '
