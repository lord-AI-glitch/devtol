about:
  content: '# À propos de DevTol

    Cette formidable plateforme regroupe des outils utiles pour les développeurs,
    concepteurs et professionnels de l''informatique. Si vous la trouvez utile, n''hésitez
    pas à la partager et à l''ajouter à vos favoris !

    DevTol fonctionne côté client, respecte votre vie privée et est 100% gratuit.
    Si vous souhaitez soutenir le développement et encourager l''ajout de nouveaux
    outils, vous pouvez nous [soutenir](https://buymeacoffee.com/lordrealstx).

    ## Technologies

    DevTol est conçu avec Vue 3, TypeScript et Naive UI. Tous les outils s''exécutent
    localement dans votre navigateur pour une confidentialité maximale.

    ## Vous avez trouvé un bug ? Un outil manque ?

    Si vous avez besoin d''un outil qui n''est pas encore présent ici, ou si vous
    souhaitez signaler un problème, n''hésitez pas à contacter notre équipe.

    '
