  xml-to-json:
    title: 'تحويل XML إلى JSON'
    description: 'تحويل مستندات وبيانات XML إلى كائنات ومصفوفات JSON منظمة وسهلة الاستخدام البرمجي.'

  yaml-validator:
    title: 'فحص وتنسيق ملفات YAML'
    description: 'التحقق من صحة صياغة ملفات YAML، تنسيقها، والتحويل إلى JSON مع توضيح أماكن وأسطر الأخطاء بدقة.'

