about:
  content: >
    # عن DevTol

    تجمع هذه المنصة الرائعة مجموعة أدوات مفيدة للمطورين والمصممين والمتخصصين في تكنولوجيا المعلومات. إذا وجدتها مفيدة، فلا تتردد في مشاركتها مع زملائك وإضافتها إلى إشاراتك المرجعية!

    تعمل DevTol بالكامل من جانب العميل (Client-side)، وتضع الخصوصية في المقام الأول، وهي مجانية بالكامل. إذا كنت ترغب في دعم التطوير وتشجيع إضافة المزيد من الأدوات، فيرجى التفكير في [دعمنا هنا](https://buymeacoffee.com/lordrealstx).

    ## التقنيات المستخدمة

    تم تطوير DevTol باستخدام Vue 3 و TypeScript و Naive UI. تعمل جميع الأدوات محلياً بنسبة 100% داخل متصفحك لضمان أقصى درجات الخصوصية والأمان.

    ## هل وجدت خطأً؟ أو تنقصك أداة معينة؟

    إذا كنت بحاجة إلى أداة غير متوفرة حالياً، أو أردت الإبلاغ عن مشكلة، فلا تتردد في التواصل مع فريقنا.

