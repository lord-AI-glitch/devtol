  markdown-to-html:
    title: 'تحويل Markdown إلى HTML'
    description: 'تحويل نصوص Markdown إلى كود HTML منسق مع إمكانية المعاينة المباشرة والطباعة أو الحفظ كـ PDF.'

  mock-data-generator:
    title: 'مولد البيانات الوهمية والتجريبية (Mock Data)'
    description: 'توليد بيانات اختبار واقعية: أسماء، عناوين بريد، عناوين جغرافية، وتواريخ وتصديرها بصيغة JSON أو CSV.'

  pdf-compress:
    title: 'ضغط ملفات PDF'
    description: 'تقليل حجم ملفات PDF مع التحكم في مستوى الجودة والضغط؛ يعمل 100% داخل المتصفح دون رفع الملفات.'

  pdf-editor:
    title: 'محرر نصوص وملفات PDF'
    description: 'محرر PDF مجاني ومحلي بالكامل. تعديل نصوص PDF، والبحث والاستبدال بدعم كامل للعربية، إضافة التوقيعات، والتعليقات والرسوم بأمان تام داخل متصفحك.'

  pdf-merge:
    title: 'دمج ملفات PDF'
    description: 'دمج عدة ملفات ومستندات PDF في ملف واحد متكامل بأمان تام داخل متصفحك دون رفع الملفات لأي خادم.'

  pdf-ocr:
    title: 'استخراج النصوص من ملفات PDF (OCR)'
    description: 'استخراج النصوص والكلمات الممسوحة ضوئياً من ملفات PDF والصور بتقنية OCR بدعم متعدد اللغات.'

  pdf-organize:
    title: 'ترتيب وتدوير صفحات PDF'
    description: 'إعادة ترتيب وتدوير وحذف صفحات مستند PDF بصرياً بالسحب والإفلات وتنزيل الملف النهائي فوراً.'

  pdf-protect:
