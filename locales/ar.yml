    description: 'اختبار وتحليل صحة التعبيرات النمطية وفحص المطابقات وتفاصيل المجموعات على نصوص تجريبية.'

  safelink-decoder:
    title: 'فك تشفير روابط Outlook SafeLinks'
    description: 'استخراج وفك تشفير الرابط الأصلي المباشر من روابط الأمان الخاصة بـ Microsoft Outlook SafeLinks.'

  svg-converter:
