    description: 'تحويل ملفات الرسوميات المتجهة SVG إلى صور PNG أو JPG بأي دقة ومقياس تريده عبر رفع الملف أو لصق الكود.'

  text-encrypt:
    title: 'تشفير وفك تشفير النصوص (AES-GCM)'
    description: 'تشفير وفك تشفير النصوص الآمن بخوارزمية AES-GCM القوية باستخدام كلمة مرور؛ يعمل محلياً في متصفحك.'

  text-sorter:
    title: 'فرز النصوص وترتيب الأسطر'
    description: 'ترتيب وفرز الأسطر أبجدياً أو حسب الطول، إزالة التكرار، وتنظيف المسافات مع خيارات فرز متعددة.'

  text-to-speech:
    title: 'تحويل النص إلى صوت (Text to Speech)'
