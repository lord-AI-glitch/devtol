    description: قارن بين كائني JSON بدقة واكتشف الاختلافات والإضافات والتعديلات بينهما.

  jwt-parser:
    title: محلل وفاحص رموز JWT
    description: فك تشفير واقرأ محتويات رموز JSON Web Token واعرض ترويستها وبياناتها بأمان محلياً.

  date-converter:
    title: محول التاريخ والوقت
    description: حوّل التواريخ والأوقات بدقة بين مختلف الصيغ العالمية القياسية وUnix Timestamp.

  phone-parser-and-formatter:
    title: محلل ومنسق أرقام الهواتف
    description: تحقق من صحة أرقام الهواتف ونسقها بالصيغة الدولية والمحلية واكتشف كود الدولة ونوع الخط.

  ipv4-subnet-calculator:
    title: حاسبة الشبكات الفرعية IPv4
    description: حلل كتل عناوين IPv4 بتدوين CIDR واكتشف نطاق العناوين وعنوان البث وقناع الشبكة.

  og-meta-generator:
    title: منشئ وسوم Open Graph
    description: أنشئ وسوم Open Graph ووسوم التواصل الاجتماعي لتحسين ظهور موقعك عند المشاركة.

  ipv6-ula-generator:
    title: مولد عناوين IPv6 ULA
    description: ولّد عناوين IPv6 محلية فريدة وغير قابلة للتوجيه العام وفقاً للمعيار RFC4193.

  hash-text:
    title: تجزئة النصوص (Hash)
    description: 'احسب تجزئة النصوص باستخدام الخوارزمية التي تحتاجها: MD5, SHA1, SHA256, SHA512 وغيرها.'

  json-to-toml:
    title: محول JSON إلى TOML
    description: حلل وحوّل بيانات ومستندات JSON إلى صيغة TOML.

  device-information:
    title: معلومات الجهاز والمواصفات
    description: اطلع على تفاصيل جهازك الحالي كأبعاد الشاشة وكثافة البكسل والمتصفح ونظام التشغيل.

  pdf-signature-checker:
    title: فاحص تواقيع مستندات PDF
    description: تحقق من صحة التواقيع الرقمية في ملفات PDF وتأكد من عدم تعديل المستند بعد توقيعه.

  json-minify:
    title: ضغط وتصغير JSON
    description: قلص حجم بيانات JSON بحذف المسافات البيضاء والأسطر غير الضرورية لتسريع النقل.

  ulid-generator:
    title: مولد معرّفات ULID
    description: أنشئ معرّفات ULID عشوائية فريدة عالمياً وقابلة للترتيب زمانياً ومعجمياً.

  string-obfuscator:
    title: تعتيم وتظليل النصوص
    description: عتّم السلاسل النصية الحساسة كالأسرار والرموز لمشاركتها بأمان دون كشف محتواها الحقيقي.

  base-converter:
    title: محول الأنظمة العددية
    description: حوّل الأعداد بين الأنظمة والأسس المختلفة (عشري، ست عشري، ثنائي، ثماني، Base64).

  yaml-to-json-converter:
    title: محول YAML إلى JSON
    description: حوّل مستندات وبيانات YAML إلى JSON فورياً في متصفحك.

  uuid-generator:
    title: مولد معرّفات UUID
    description: أنشئ معرّفات فريدة عالمياً (UUID) بمختلف إصداراتها لتعيين معرّفات مميزة لعناصر بياناتك.

  ipv4-address-converter:
    title: محول عناوين IPv4
    description: حوّل عنوان IP إلى تمثيل عشري، أو ثنائي، أو ست عشري، أو إلى صيغة IPv6 المقابلة.

  text-statistics:
    title: إحصائيات وتحليل النصوص
    description: احسب عدد الكلمات، والأحرف، والأسطر، وحجم النص بالبايت وزمن القراءة المتوقع.

  text-to-nato-alphabet:
    title: تحويل النص لأبجدية الناتو
    description: حوّل النصوص إلى الأبجدية الصوتية العسكرية (NATO Phonetic) لسهولة النطق اللاسلكي.

  basic-auth-generator:
    title: منشئ ترويسة Basic Auth
    description: ولّد ترويسة المصادقة الأساسية المشفرة بـ Base64 من اسم المستخدم وكلمة المرور.

  text-to-unicode:
    title: تحويل النصوص إلى يونيكود
    description: فكك وحوّل محارف النصوص إلى شفرة اليونيكود البرمجية والعكس بالعكس.

  ipv4-range-expander:
    title: موسّع نطاق عناوين IPv4
    description: احسب الشبكات الفرعية الصالحة بتدوين CIDR انطلاقاً من عنواني بداية ونهاية IPv4.

  text-diff:
    title: مقارنة النصوص (Text Diff)
    description: قارن بين نصين واكتشف بدقة الاختلافات والأسطر والكلمات المضافة والمحذوفة.

  otp-generator:
    title: مولد رموز التحقق OTP
    description: أنشئ وافحص رموز المرور لمرة واحدة المعتمدة على الوقت (TOTP) للمصادقة الثنائية.

  url-encoder:
    title: ترميز وفك ترميز الروابط
    description: رمّز النصوص إلى صيغة روابط الويب الآمنة (Percent-encoded) أو فك ترميزها بدقة.

  text-to-binary:
    title: تحويل النصوص إلى النظام الثنائي
    description: حوّل النصوص إلى سلاسل ثنائية (0 و 1) بجدول ASCII والعكس بالعكس.

  ascii-text-drawer:
    title: 'مولد نصوص فن الآسكي (ASCII Art)'
    description: 'أنشئ نصوصاً فنية ورسومات برمجية بصيغة ASCII مع العديد من الخطوط والأنماط المميزة.'

  color-palette:
    title: 'مولد لوحات الألوان وتناسقها'
    description: 'توليد لوحات ألوان متناسقة، والتحويل بين HEX/RGB/HSL/CMYK مع فحص درجات تباين إمكانية الوصول WCAG.'

  email-normalizer:
    title: 'منسق وموحد البريد الإلكتروني'
    description: 'توحيد وتنسيق عناوين البريد الإلكتروني وفق المعايير القياسية لإزالة التكرار وتنظيف قواعد البيانات.'

  exif-viewer:
    title: 'عارض وحاذف بيانات الصور (EXIF)'
    description: 'عرض وحذف البيانات الوصفية EXIF من الصور؛ إظهار إعدادات الكاميرا، وبيانات الموقع الجغرافي GPS، والمزيد.'

  favicon-generator:
    title: 'مولد أيقونات المواقع (Favicon)'
    description: 'توليد جميع أحجام أيقونات المواقع وتطبيقات الويب (من 16x16 إلى 512x512) من صورة واحدة وتنزيلها كملف ZIP.'

  image-compressor:
    title: 'ضاغط الصور (JPG, PNG, WebP)'
    description: 'ضغط صور JPG وPNG وWebP لتقليل الحجم حتى 90% مع معاينة فورية ومحلية دون رفعها لأي خادم.'

  image-ocr:
    title: 'استخراج النصوص من الصور (OCR)'
    description: 'استخراج النصوص والكلمات المكتوبة داخل الصور بتقنية التعرف الضوئي (OCR) مع دعم العربية والإنجليزية وغيرها.'

  image-resizer:
    title: 'تغيير أبعاد واقتصاص الصور'
    description: 'تغيير حجم الصور إلى أبعاد محددة بدقة أو اقتصاصها بنسب أبعاد قياسية محلياً في المتصفح.'

  image-watermark:
    title: 'إضافة علامة مائية للصور'
    description: 'أضف علامة مائية نصية أو شعاراً مصوراً على الصور مع تخصيص الموضع ونسبة الشفافية والنمط.'

  images-to-pdf:
    title: 'تحويل الصور إلى ملف PDF'
    description: 'دمج وتحويل صور JPG وPNG وWebP إلى مستند PDF واحد بجودة فائقة ومحلياً بالكامل.'

  json-to-xml:
    title: 'تحويل JSON إلى XML'
    description: 'تحويل كائنات ومصفوفات JSON إلى بنية مستندات XML مع التنسيق التلقائي.'

  jwt-builder:
    title: 'إنشاء وتوقيع توكنات JWT'
    description: 'بناء وتوقيع وفك تشفير رموز JSON Web Tokens مع ترويسات وبيانات مخصصة وتوقيع HMAC-SHA256.'

  line-deduplicator:
    title: 'إزالة الأسطر المكررة وتنظيف القوائم'
