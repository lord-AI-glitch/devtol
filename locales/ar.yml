  pdf-redact:
    title: 'تنقيح وطمس النصوص السرية في PDF'
    description: 'طمس وحذف المعلومات والبيانات الحساسة بشكل نهائي وغير قابل للاسترجاع من ملفات PDF بخصوصية تامة.'

  pdf-split:
    title: 'تقسيم واستخراج صفحات PDF'
    description: 'تقسيم ملف PDF أو استخراج صفحات محددة ومجالات مخصصة بأمان وسرعة فائقة محلياً.'

  pdf-to-image:
    title: 'تحويل مستندات PDF إلى صور'
