about:
  content: '# Über DevTol

    Diese wunderbare Plattform sammelt nützliche Tools für Entwickler, Designer und
    Personen, die in der IT arbeiten. Wenn du sie nützlich findest, teile sie gerne
    mit Kollegen und speichere sie in deiner Lesezeichenleiste!

    DevTol ist clientseitig, datenschutzorientiert und vollständig kostenlos. Wenn
    du die Entwicklung unterstützen und uns ermutigen möchtest, weitere Tools hinzuzufügen,
    kannst du uns gerne durch [Sponsoring](https://buymeacoffee.com/lordrealstx) unterstützen.

    ## Technologien

    DevTol wurde mit Vue 3, TypeScript und Naive UI entwickelt. Alle Tools laufen
    zu 100 % lokal in deinem Browser für maximalen Datenschutz und Sicherheit.

    ## Einen Fehler gefunden? Ein Tool fehlt?

    Wenn du ein Tool benötigst, das hier noch nicht vorhanden ist, oder ein Problem
    melden möchtest, kannst du dich jederzeit an unser Team wenden.

    '
