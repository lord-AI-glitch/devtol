about:
  content: '# Про DevTol

    Ця чудова платформа об''єднує корисні інструменти для розробників, дизайнерів
    та ІТ-фахівців. Якщо вона для вас корисна, поділіться нею з колегами та збережіть
    у закладках!

    DevTol працює на стороні клієнта, ставить конфіденційність на перше місце та є
    на 100% безкоштовним. Якщо ви хочете підтримати розробку та стимулювати додавання
    нових інструментів, підтримайте нас [тут](https://buymeacoffee.com/lordrealstx).

    ## Технології

    DevTol створений за допомогою Vue 3, TypeScript і Naive UI. Усі інструменти працюють
    на 100% локально у вашому браузері для максимальної приватності та безпеки.

    ## Знайшли баг? Відсутній інструмент?

    Якщо вам потрібен інструмент, якого наразі немає, або ви хочете повідомити про
    проблему, зв''яжіться з нашою командою.

    '
