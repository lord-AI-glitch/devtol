about:
  content: >
    # Sobre o DevTol

    Esta maravilhosa plataforma reúne ferramentas úteis para desenvolvedores, designers e profissionais de TI. Se você achou o site útil, compartilhe com seus colegas e adicione aos seus favoritos!

    O DevTol roda no lado do cliente, prioriza a privacidade e é 100% gratuito. Se quiser apoiar o desenvolvimento e incentivar a adição de mais ferramentas, por favor considere nos [apoiar](https://buymeacoffee.com/lordrealstx).

    ## Tecnologias

    O DevTol foi desenvolvido com Vue 3, TypeScript e Naive UI. Todas as ferramentas executam 100% localmente no seu navegador para máxima privacidade e segurança.

    ## Encontrou um bug? Falta alguma ferramenta?

    Se você precisa de uma ferramenta que ainda não existe aqui ou deseja relatar um problema, sinta-se à vontade para entrar em contato com nossa equipe.

