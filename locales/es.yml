about:
  content: >
    # Sobre DevTol

    Esta maravillosa plataforma reúne herramientas útiles para desarrolladores, diseñadores y profesionales de TI. Si la encuentra útil, ¡no dude en compartirla con sus colegas y agregarla a sus favoritos!

    DevTol funciona en el lado del cliente, prioriza la privacidad y es 100% gratuito. Si desea apoyar el desarrollo y fomentar la incorporación de más herramientas, considere [apoyarnos](https://buymeacoffee.com/lordrealstx).

    ## Tecnologías

    DevTol está desarrollado con Vue 3, TypeScript y Naive UI. Todas las herramientas se ejecutan localmente en su navegador para garantizar la máxima privacidad y seguridad.

    ## ¿Encontró un error? ¿Falta una herramienta?

    Si necesita una herramienta que actualmente no esté disponible o desea informar un problema, no dude en comunicarse con nuestro equipo.

