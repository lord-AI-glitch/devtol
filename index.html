    <!-- ARIA Accessibility Tree Sanitizer (Fixes vendor library typos like aria-hiddens) -->
    <script>
      (function() {
        function fixAria() {
          var badNodes = document.querySelectorAll('[aria-hiddens]');
          for (var i = 0; i < badNodes.length; i++) {
            var el = badNodes[i];
            el.setAttribute('aria-hidden', el.getAttribute('aria-hiddens') || 'true');
            el.removeAttribute('aria-hiddens');
          }
        }
        if (typeof window !== 'undefined') {
          window.addEventListener('load', function() {
            if ('requestIdleCallback' in window) {
              window.requestIdleCallback(fixAria);
            } else {
              setTimeout(fixAria, 200);
            }
          });
        }
      })();
    </script>
